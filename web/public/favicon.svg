<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>EDUNEXUS</title>
  <!--
    The workspace mark, cut for a tab. It is the same geometry as
    web/components/brand.tsx and docs/brand/edunexus-mark.svg, with two changes
    a 16px tab needs: an opaque white ground, because the navy mountain and the
    white pages both vanish against a dark browser theme, and none of the
    sub-pixel notches inside the peaks, which only turn to grey mud at this size.
    Re-cut all three together; the PNG in docs/brand/ is the reference.
  -->
